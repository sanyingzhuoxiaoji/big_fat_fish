<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>大肥鱼操作面板</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<div id="boot" class="boot">
  <p class="boot-title">正在连接大肥鱼…</p>
  <p id="boot-error" class="line-status is-error" role="alert"></p>
  <button id="boot-retry" type="button" class="btn" hidden>重试</button>
</div>

<div id="panel-root" class="panel" hidden>
  <header class="panel-head">
    <h1>大肥鱼</h1>
    <button id="btn-hide-panel" type="button" class="btn ghost">关闭面板</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="面板分区">
    <button type="button" role="tab" id="tab-chat" aria-controls="view-chat" aria-selected="true">聊天</button>
    <button type="button" role="tab" id="tab-tasks" aria-controls="view-tasks" aria-selected="false" tabindex="-1">待办</button>
    <button type="button" role="tab" id="tab-focus" aria-controls="view-focus" aria-selected="false" tabindex="-1">专注</button>
    <button type="button" role="tab" id="tab-settings" aria-controls="view-settings" aria-selected="false" tabindex="-1">设置</button>
  </nav>

  <main class="views">

    <section id="view-chat" class="chat-view" role="tabpanel" aria-labelledby="tab-chat">
      <div id="chat-log" class="chat-log">
        <div id="chat-messages"></div>
        <div id="chat-live"></div>
        <p id="chat-empty" class="empty">还没有对话，向大肥鱼说点什么吧。</p>
      </div>
      <p id="chat-error" class="line-status" role="status" hidden></p>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="chat-input">消息内容</label>
        <textarea id="chat-input" rows="2" placeholder="和大肥鱼说点什么（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="composer-row">
          <div class="composer-btns">
            <button id="btn-chat-clear" type="button" class="btn ghost">清除会话</button>
            <button id="btn-chat-stop" type="button" class="btn ghost" hidden>停止回复</button>
            <button id="btn-chat-send" type="submit" class="btn primary">发送</button>
          </div>
        </div>
      </form>
    </section>

    <section id="view-tasks" class="scroll-view" role="tabpanel" aria-labelledby="tab-tasks" hidden>
      <div class="section-head">
        <h2>待办</h2>
        <div class="head-actions">
          <button id="btn-open-notes" type="button" class="btn small">启动便签</button>
          <button id="btn-connect-notes" type="button" class="btn small">重新连接</button>
        </div>
      </div>
      <p id="notes-status" class="line-status" role="status"></p>
      <p id="tasks-msg" class="line-status" role="status" hidden></p>

      <form id="task-form" class="stack-form">
        <label for="task-text">新任务</label>
        <input id="task-text" type="text" placeholder="例如：整理下周会议纪要">
        <label for="task-remind">提醒时间（可选）</label>
        <input id="task-remind" type="datetime-local">
        <button id="btn-create-task" type="submit" class="btn primary block">添加任务</button>
      </form>

      <h3>未完成</h3>
      <ul id="todo-list" class="task-list"></ul>
      <p id="todo-empty" class="empty" hidden>没有未完成的任务。</p>

      <h3>已完成</h3>
      <ul id="done-list" class="task-list"></ul>
      <p id="done-empty" class="empty" hidden>还没有完成的任务。</p>
    </section>

    <section id="view-focus" class="scroll-view" role="tabpanel" aria-labelledby="tab-focus" hidden>
      <h2>专注</h2>
      <div class="focus-now">
        <p id="focus-phase" class="focus-phase">未开始</p>
        <p id="focus-time" class="focus-time is-idle">--:--</p>
        <p id="focus-target" class="focus-target" hidden></p>
      </div>
      <div class="focus-setup">
        <label for="focus-task">专注对象</label>
        <select id="focus-task">
          <option value="">自由专注</option>
        </select>
        <div id="focus-goal-wrap">
          <label for="focus-goal">自由专注目标</label>
          <input id="focus-goal" type="text" placeholder="例如：读完一章">
        </div>
        <div class="minutes-row">
          <div>
            <label for="focus-work">专注分钟</label>
            <input id="focus-work" type="number" min="0.1" step="any" inputmode="decimal">
          </div>
          <div>
            <label for="focus-rest">休息分钟</label>
            <input id="focus-rest" type="number" min="0.1" step="any" inputmode="decimal">
          </div>
        </div>
      </div>
      <div class="focus-actions">
        <button id="btn-focus-start" type="button" class="btn primary">开始专注</button>
        <button id="btn-focus-pause" type="button" class="btn" hidden>暂停</button>
        <button id="btn-focus-resume" type="button" class="btn primary" hidden>继续</button>
        <button id="btn-focus-rest" type="button" class="btn primary" hidden>开始休息</button>
        <button id="btn-focus-stop" type="button" class="btn danger-ghost" hidden>结束</button>
      </div>
      <p id="focus-msg" class="line-status" role="status" hidden></p>
      <p id="focus-today" class="focus-today"></p>
    </section>

    <section id="view-settings" class="scroll-view" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <h2>设置</h2>
      <p id="settings-msg" class="line-status" role="status" hidden></p>
      <form id="settings-form" class="stack-form" autocomplete="off">
        <h3>聊天服务</h3>
        <label for="set-api-base">API 地址</label>
        <input id="set-api-base" type="text" spellcheck="false">
        <label for="set-model">API 模型</label>
        <div class="field-row">
          <input id="set-model" type="text" spellcheck="false">
        </div>
        <p class="hint">新配置默认 glm-5.3-flash（标准 API 按量计费，不使用 Coding Plan 配额）。已有模型选择不会自动更改。</p>
        <label for="set-api-key">API Key</label>
        <input id="set-api-key" type="password" autocomplete="new-password" placeholder="未保存时在此填写">
        <p id="key-state" class="hint"></p>
        <label class="check">
          <input id="set-remember-key" type="checkbox"> 记住 Key（加密保存在本机）
        </label>
        <button id="btn-clear-key" type="button" class="btn danger-ghost">清除已保存的 Key</button>

        <h3>番茄钟默认时长（分钟）</h3>
        <div class="minutes-row">
          <div>
            <label for="set-work">专注</label>
            <input id="set-work" type="number" min="0.1" step="any" inputmode="decimal">
          </div>
          <div>
            <label for="set-rest">休息</label>
            <input id="set-rest" type="number" min="0.1" step="any" inputmode="decimal">
          </div>
        </div>

        <h3>便签</h3>
        <label for="set-note-project">便签项目路径</label>
        <input id="set-note-project" type="text" spellcheck="false">
        <label for="set-note-data">便签数据目录</label>
        <input id="set-note-data" type="text" spellcheck="false">
        <button id="btn-save-settings" type="submit" class="btn primary block">保存设置</button>
      </form>

      <h3>桌宠与 Live2D 模型</h3>
      <div class="field-row wrap">
        <button id="btn-select-model" type="button" class="btn">选择 Live2D 文件</button>
        <button id="btn-mouse-through" type="button" class="btn">开启鼠标穿透</button>
        <button id="btn-hide-panel-settings" type="button" class="btn">关闭面板</button>
      </div>
      <p id="mouse-state" class="hint">鼠标穿透：关闭</p>
    </section>

  </main>
</div>

<script src="panel.js"></script>
</body>
</html>
